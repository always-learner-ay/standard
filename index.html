<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초등학교 국어, 사회, 영어 교육과정 운영</title>
    <!-- Vis.js for Network Graph -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            --glass-bg: rgba(255, 255, 255, 0.35);
            --glass-border: 1px solid rgba(255, 255, 255, 0.4);
            --chatbot-bg: rgba(255, 255, 255, 0.85);
            --text-color: #2c3e50;
            --accent-color: #6a11cb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            background: var(--primary-gradient);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 15px;
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border-bottom: var(--glass-border);
            flex-shrink: 0;
            z-index: 10;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        main {
            display: flex;
            flex: 1;
            padding: 15px;
            gap: 15px;
            height: calc(100vh - 70px);
            overflow: hidden;
        }

        /* Container Styles */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            border: var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Left Panel: Chatbot (25%) */
        .chatbot-container {
            flex: 0 0 25%;
            /* Fixed 25% width */
            min-width: 250px;
            background: var(--chatbot-bg);
            /* Slightly more opaque for readability */
        }

        .chat-header {
            padding: 15px;
            background: var(--accent-color);
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f9f9f9;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
            position: relative;
        }

        .message.bot {
            align-self: flex-start;
            background: #e9e9eb;
            color: #333;
            border-bottom-left-radius: 2px;
        }

        .message.user {
            align-self: flex-end;
            background: var(--accent-color);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .chat-input-area {
            padding: 12px;
            background: white;
            display: flex;
            gap: 8px;
            border-top: 1px solid #eee;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 12px;
            border-radius: 20px;
            border: 1px solid #ddd;
            outline: none;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .chat-input-area input:focus {
            border-color: var(--accent-color);
        }

        .chat-input-area button {
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            background: var(--accent-color);
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .chat-input-area button:hover {
            opacity: 0.9;
        }

        /* Right Panel: Graph (75%) */
        .graph-container {
            flex: 1;
            position: relative;
        }

        #mynetwork {
            width: 100%;
            height: 100%;
        }

        /* Tooltip-like Info Panel */
        #infoPanel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid #ddd;
            display: none;
            z-index: 100;
        }

        #infoPanel h3 {
            margin-bottom: 10px;
            font-size: 1.1rem;
            color: var(--accent-color);
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }

        #infoPanel p {
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #555;
        }

        #infoPanel a {
            display: inline-block;
            margin-top: 5px;
            padding: 6px 12px;
            background: var(--accent-color);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>

    <header>
        <h1>초등학교 국어, 사회, 영어 교육과정 운영</h1>
    </header>

    <main>
        <!-- Left: Chatbot (Left 1/4) -->
        <section class="glass-panel chatbot-container">
            <div class="chat-header">
                💬 AI 챗봇
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    안녕하세요! 교육과정 RDF 그래프를 탐색하다 궁금한 점이 있으면 물어보세요.
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="질문을 입력하세요..." onkeypress="handleKeyPress(event)">
                <button onclick="handleSendMessage()">전송</button>
            </div>
        </section>

        <!-- Right: RDF Graph (Right 3/4) -->
        <section class="glass-panel graph-container">
            <div id="mynetwork"></div>
            <div id="infoPanel">
                <h3 id="infoTitle">제목</h3>
                <p id="infoDesc">내용이 여기에 표시됩니다.</p>
                <a href="#" id="infoLink" target="_blank" style="display:none;">바로가기</a>
            </div>
        </section>
    </main>

    <script>
        // --- Data Preparation based on standard.ttl.txt ---
        const subjects = [
            { id: 'sub_kor', label: '국어', group: 'subject', color: '#FF9999' },
            { id: 'sub_soc', label: '사회', group: 'subject', color: '#99FF99' },
            { id: 'sub_eng', label: '영어', group: 'subject', color: '#99CCFF' }
        ];

        const standards = [
            // 국어
            { id: 'kor_01', label: '2국02-01\n소리내어 읽기', title: '글자, 단어, 문장, 짧은 글을 정확하게 소리 내어 읽는다.', pid: 'sub_kor' },
            { id: 'kor_02', label: '2국02-02\n띄어 읽기', title: '의미가 잘 드러나도록 문장과 짧은 글을 알맞게 띄어 읽는다.', pid: 'sub_kor' },
            { id: 'kor_03', label: '2국02-03\n중심 내용', title: '글을 읽고 중심 내용을 확인한다.', pid: 'sub_kor' },
            { id: 'kor_04', label: '2국02-04\n인물 공감', title: '인물의 마음이나 생각을 짐작하고 이를 자신과 비교하며 글을 읽는다.', pid: 'sub_kor' },
            { id: 'kor_05', label: '2국02-05\n읽기 흥미', title: '읽기에 흥미를 가지고 즐겨 읽는 태도를 지닌다.', pid: 'sub_kor' },
            { id: 'kor_L1', label: '2국01-01\n순서 듣고 말하기', title: '중요한 내용이나 일이 일어난 순서를 고려하며 듣고 말한다.', pid: 'sub_kor' },
            { id: 'kor_L2', label: '2국01-02\n고운 말', title: '바르고 고운 말로 서로의 감정을 나누며 듣고 말한다.', pid: 'sub_kor' },

            // 사회
            { id: 'soc_01', label: '4사02-01\n시간과 역사', title: '일상 속에서 시간의 흐름을 경험할 수 있는 사례를 살펴보고 역사의 시간 개념 이해', pid: 'sub_soc' },
            { id: 'soc_02', label: '4사02-02\n옛날 생활', title: '오래된 물건이나 자료들을 통해 과거의 모습을 살펴봄을 이해', pid: 'sub_soc' },
            { id: 'soc_03', label: '4사02-03\n지역 변화', title: '지역의 변화상을 보여주는 역사 자료 분석 및 생활 모습 파악', pid: 'sub_soc' },
            { id: 'soc_04', label: '4사04-02\n교통 변화', title: '교통의 변화에 따른 이동과 생활 모습의 변화 이해', pid: 'sub_soc' },
            { id: 'soc_05', label: '4사05-01\n지도 요소', title: '다양한 종류의 지도를 찾아보고 지도의 요소 이해', pid: 'sub_soc' },

            // 영어
            { id: 'eng_01', label: '4영01-01\n알파벳 식별', title: '알파벳과 간단한 단어 소리 듣고 식별', pid: 'sub_eng' },
            { id: 'eng_02', label: '4영01-02\n알파벳 읽기', title: '알파벳 대소문자를 식별하여 읽는다.', pid: 'sub_eng' },
            { id: 'eng_03', label: '4영01-03\n강세와 리듬', title: '단어, 어구, 문장의 강세, 리듬, 억양 식별', pid: 'sub_eng' },
            { id: 'eng_04', label: '4영01-04\n파닉스', title: '소리와 철자의 관계 이해 및 소리 내어 읽기', pid: 'sub_eng' },
            { id: 'eng_05', label: '4영01-10\n타문화 존중', title: '문화 담화나 문장을 존중의 태도로 듣기/읽기', pid: 'sub_eng' }
        ];

        const resources = [
            // 국어 Resources
            { id: 'res_k1', label: '에듀넷: 소리 내어 읽기', url: 'https://www.edunet.net/nview.do?contentsNo=KOR_RD_01', pid: 'kor_01' },
            { id: 'res_k2', label: '국립국어원: 띄어읽기 가이드', url: 'https://www.korean.go.kr/learn/read_guide', pid: 'kor_02' },
            { id: 'res_k3', label: 'EBS 문해력 쑥쑥', url: 'https://primary.ebs.co.kr/course/view?courseId=10203', pid: 'kor_03' },
            { id: 'res_k4', label: '독서교육: 인물 공감', url: 'https://reading.edunet.net/activity/mind', pid: 'kor_04' },

            // 사회 Resources
            { id: 'res_s1', label: '역사박물관 시간여행', url: 'https://www.museum.go.kr/kids/time', pid: 'soc_01' },
            { id: 'res_s2', label: 'e-뮤지엄', url: 'https://www.emuseum.go.kr/search', pid: 'soc_02' },
            { id: 'res_s4', label: '철도박물관', url: 'https://www.railroadmuseum.korail.com', pid: 'soc_04' },
            { id: 'res_s5', label: '국토지리정보원', url: 'https://www.ngii.go.kr/map', pid: 'soc_05' },

            // 영어 Resources
            { id: 'res_e1', label: 'Starfall ABCs', url: 'https://www.starfall.com/h/abcs/', pid: 'eng_01' },
            { id: 'res_e2', label: 'EBS 알파벳 마스터', url: 'https://primary.ebs.co.kr/course/view?courseId=ENG0102', pid: 'eng_02' },
            { id: 'res_e3', label: 'British Council Kids', url: 'https://learnenglishkids.britishcouncil.org/', pid: 'eng_03' },
            { id: 'res_e4', label: 'Little Fox Phonics', url: 'https://www.littlefox.com/phonics', pid: 'eng_04' },
            { id: 'res_e10', label: 'NG Kids: Cultures', url: 'https://kids.nationalgeographic.com/history', pid: 'eng_05' }
        ];

        // Combine into Nodes and Edges
        let allNodes = [];
        let allEdges = [];

        // Add Subjects
        subjects.forEach(sub => {
            allNodes.push({ id: sub.id, label: sub.label, group: 'subject', color: sub.color, font: { size: 24, face: 'arial', strokeWidth: 3, strokeColor: '#ffffff' } });
        });

        // Add Standards
        standards.forEach(std => {
            allNodes.push({ id: std.id, label: std.label, title: std.title, group: 'standard', color: '#FFFACD', shape: 'box' });
            allEdges.push({ from: std.pid, to: std.id, arrows: 'to', color: { color: '#ccc' } });
        });

        // Add Resources
        resources.forEach(res => {
            allNodes.push({ id: res.id, label: res.label, url: res.url, group: 'resource', color: '#E0FFFF', shape: 'ellipse' });
            allEdges.push({ from: res.pid, to: res.id, arrows: 'to', dashes: true, color: { color: '#888' } });
        });


        // --- Vis.js Graph Setup ---
        const container = document.getElementById('mynetwork');
        const data = {
            nodes: new vis.DataSet(allNodes),
            edges: new vis.DataSet(allEdges)
        };
        const options = {
            nodes: {
                shape: 'dot',
                size: 20,
                font: {
                    size: 14,
                    color: '#333'
                },
                borderWidth: 2,
                shadow: true
            },
            edges: {
                width: 2,
                shadow: true,
                smooth: {
                    type: 'continuous'
                }
            },
            physics: {
                forceAtlas2Based: {
                    gravitationalConstant: -100,
                    centralGravity: 0.01,
                    springLength: 150,
                    springConstant: 0.08
                },
                maxVelocity: 50,
                solver: 'forceAtlas2Based',
                timestep: 0.35,
                stabilization: { iterations: 150 }
            },
            groups: {
                subject: { size: 40, borderWidth: 3 },
                standard: { size: 25 },
                resource: { size: 15, shape: 'icon' }
            },
            interaction: {
                hover: true,
                tooltipDelay: 200
            }
        };

        const network = new vis.Network(container, data, options);

        // Interaction
        const infoPanel = document.getElementById('infoPanel');
        const infoTitle = document.getElementById('infoTitle');
        const infoDesc = document.getElementById('infoDesc');
        const infoLink = document.getElementById('infoLink');

        network.on("click", function (params) {
            if (params.nodes.length > 0) {
                const nodeId = params.nodes[0];
                const node = data.nodes.get(nodeId);

                infoPanel.style.display = 'block';

                // Content Logic
                if (node.group === 'subject') {
                    infoTitle.innerText = `[과목] ${node.label}`;
                    infoDesc.innerText = "이 과목의 성취기준들이 연결되어 있습니다.";
                    infoLink.style.display = 'none';
                } else if (node.group === 'standard') {
                    infoTitle.innerText = `[성취기준] ${node.label.replace(/\n/g, ' ')}`;
                    infoDesc.innerText = node.title || "내용 없음";
                    infoLink.style.display = 'none';
                } else if (node.group === 'resource') {
                    infoTitle.innerText = `[자료] ${node.label}`;
                    infoDesc.innerText = "클릭하여 해당 자료로 이동할 수 있습니다.";
                    infoLink.style.display = 'inline-block';
                    infoLink.href = node.url || "#";
                    infoLink.innerText = "자료 열기 🔗";
                }
            } else {
                infoPanel.style.display = 'none';
            }
        });

        // --- Chatbot Logic ---
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.innerText = text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleSendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            chatInput.value = '';

            setTimeout(() => {
                let response = "교육과정이나 그래프에 대해 물어보세요! 예: '국어 성취기준은?', '이 그래프는 뭘 의미해?'";

                if (text.includes("안녕")) {
                    response = "안녕하세요! 교육과정 시각화 도우미입니다. 무엇을 도와드릴까요?";
                } else if (text.includes("국어")) {
                    response = "오른쪽 그래프에서 분홍색 '국어' 노드를 찾아보세요. 관련된 성취 기준들이 연결되어 있습니다.";
                    network.selectNodes(['sub_kor']);
                    network.focus('sub_kor', { animation: true, scale: 1.2 });
                } else if (text.includes("사회")) {
                    response = "사회 과목은 초록색 노드로 표시되어 있습니다. 역사와 지리 관련 내용이 보여요.";
                    network.selectNodes(['sub_soc']);
                    network.focus('sub_soc', { animation: true, scale: 1.2 });
                } else if (text.includes("그래프")) {
                    response = "이 그래프는 RDF 구조(Subject-Object 관계)를 보여줍니다. 중심에 과목이 있고, 성취기준과 학습 자료가 뻗어나가는 형태입니다.";
                }

                addMessage(response, 'bot');
            }, 600);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') handleSendMessage();
        }

    </script>
</body>

</html>
